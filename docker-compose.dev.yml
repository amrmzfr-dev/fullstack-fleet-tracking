services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend-fleet-dotnet
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=fleet;Username=fleet;Password=fleet
      ConnectionStrings__Redis: redis:6379
      Jwt__Secret: dev-jwt-secret-change-me
      Admin__Email: admin@fleet.local
      Admin__PasswordHash: $2a$11$examplehashreplacebeforeuse
      Tracking__OverspeedThreshold: 120
      Tracking__AlertCooldownSeconds: 60
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend-fleet-react
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
